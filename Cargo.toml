[package]
name = "plasticism-draw"
version = "0.1.0"
authors = ["ChenWuwei404 <uplantting@163.com>"]
repository = "https://github.com/ChenWuwei404/plasticism-draw"
edition = "2024"
license = "MIT"

[lib]
name = "plasticism_draw"
path = "src/lib.rs"

[[bin]]
name = "plasticism-draw"
path = "src/main.rs"

# Keep debug builds responsive. Vello, wgpu, and font shaping are extremely hot
# in an immediate-mode renderer; compiling them at opt-level 0 makes even simple
# scenes take tens of milliseconds per frame. The project itself stays at
# opt-level 1 so backtraces and debugger behavior remain useful.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dependencies]
anyhow = "1.0.104"
glifo = "0.4.0"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
pollster = "1.0.1"
skrifa = "0.44.0"
usvg = { version = "0.48.1", default-features = false }
vello_gpu = { version = "0.3.0", features = ["text"] }
wgpu = "30.0.1"
winit = "0.30.13"
