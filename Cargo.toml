[package]
name = "plasticism-draw"
version = "0.1.0"
edition = "2024"

[lib]
name = "plasticism_draw"
path = "src/lib.rs"

[[bin]]
name = "plasticism-draw"
path = "src/main.rs"

# Keep debug builds responsive. Vello, wgpu, and font shaping are extremely hot
# in an immediate-mode renderer; compiling them at opt-level 0 makes even simple
# scenes take tens of milliseconds per frame. The project itself stays at
# opt-level 1 so backtraces and debugger behavior remain useful.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dependencies]
anyhow = "1.0.104"
glifo = "0.4.0"
pollster = "1.0.1"
skrifa = "0.44.0"
vello_gpu = { version = "0.3.0", features = ["text"] }
wgpu = "30.0.1"
winit = "0.30.13"
